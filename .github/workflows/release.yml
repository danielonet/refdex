name: Release

# Publishes to the Visual Studio Marketplace when a version tag (vX.Y.Z) is pushed.
# Release flow:  npm version patch -w refdex   (bumps packages/vscode/package.json)
#                git commit -am "Release vX.Y.Z" && git tag vX.Y.Z
#                git push --follow-tags
# IntelliJ plugin (own version, plugins/intellij/gradle.properties pluginVersion):
#                set pluginVersion, commit, git tag intellij-vX.Y.Z, git push --follow-tags

on:
  push:
    tags: ['v*.*.*', 'intellij-v*.*.*']
  workflow_dispatch:

permissions:
  contents: write # to attach the .vsix to a GitHub release
  id-token: write # OIDC token for Marketplace trusted publishing

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Check tag matches extension version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG="v$(node -p "require('./packages/vscode/package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/vscode/package.json version $PKG" >&2
            exit 1
          fi

      - run: npm run compile -w refdex
      - run: npm test

      # --no-dependencies: the extension is bundled by esbuild and npm workspaces hoist
      # node_modules to the root, which vsce's dependency scan does not understand.
      - name: Package
        run: npx --yes @vscode/vsce package --no-dependencies --out "$GITHUB_WORKSPACE/refdex.vsix"
        working-directory: packages/vscode

      - name: Publish to Visual Studio Marketplace
        # Trusted publishing: authenticates via the job's GitHub OIDC token (no PAT).
        run: npx --yes @vscode/vsce@latest publish --oidc --packagePath "$GITHUB_WORKSPACE/refdex.vsix"
        working-directory: packages/vscode

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" refdex.vsix --generate-notes

  publish-intellij:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/intellij-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci

      - name: Check tag matches plugin version
        if: startsWith(github.ref, 'refs/tags/intellij-v')
        run: |
          PKG="intellij-v$(sed -n 's/^pluginVersion *= *//p' plugins/intellij/gradle.properties)"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pluginVersion ($PKG)" >&2
            exit 1
          fi

      - name: Test and build plugin
        run: ./gradlew --no-daemon test buildPlugin
        working-directory: plugins/intellij

      - name: Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN }}
        run: ./gradlew --no-daemon publishPlugin -PskipDaemonBuild
        working-directory: plugins/intellij
